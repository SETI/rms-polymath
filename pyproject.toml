[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-polymath"
dynamic = ["version"]
description = "Wrapper for NumPy that adds easy masks and vector computation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # The code is written against NumPy 2 semantics throughout.
  "numpy>=2.0",
  "rms-fpzip>=1.0"
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["polymath"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-polymath"
Documentation = "https://rms-polymath.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-polymath"
Source = "https://github.com/SETI/rms-polymath"
Issues = "https://github.com/SETI/rms-polymath/issues"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = ["-n", "auto", "--cov=src/polymath", "--strict-markers", "--strict-config"]
markers = []
filterwarnings = ["error"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker and type stubs must be shipped in the wheel, or downstream type
# checkers ignore them.
polymath = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/polymath/_version.py"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "flake8",
  # mypy is not run against src (see CLAUDE.md), but stubtest ships with it
  "mypy>=1.0",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  # "bandit[toml]>=1.8",
  "pyroma>=4.2",
  # "vulture>=2.14",
  "rms-polymath[docs]",
]
docs = [
  "myst-parser",
  # Sphinx 9 is the first release whose Python domain resolves a py:class reference --
  # which Napoleon generates for every docstring type -- to the py:data target that
  # autodoc creates for a type alias. On Sphinx 8 and earlier every "*Like" alias in
  # polymath.typedefs is left unresolved and the nitpicky -W build fails.
  "sphinx>=9",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Must match --cov in the pytest addopts above, or fail_under measures something else
source = ["src/polymath"]
omit = ["tests/*", "_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false
# stubtest discovers every module under the package and would compare each unannotated
# .py module against itself. Only __init__.pyi and typedefs.pyi carry type information,
# so every other module is excluded from discovery; the overrides below keep mypy from
# following an import into one of them.
exclude = [
  'polymath/(qube|unit|scalar|boolean|vector|pair|vector3|quaternion|polynomial|matrix|matrix3)\.py$',
  'polymath/extensions/',
]

[[tool.mypy.overrides]]
module = "polymath._version"
ignore_missing_imports = true

# The published type information lives in __init__.pyi and typedefs.pyi, because the only
# supported imports are from those two modules. Every other module is deliberately
# unannotated and has no stub, so mypy must not be turned loose on it. These overrides
# keep mypy to the two stubs, which is what `mypy.stubtest` needs in order to run.
[[tool.mypy.overrides]]
module = [
  "polymath.extensions.*",
  "polymath.qube",
  "polymath.unit",
  "polymath.scalar",
  "polymath.boolean",
  "polymath.vector",
  "polymath.pair",
  "polymath.vector3",
  "polymath.quaternion",
  "polymath.polynomial",
  "polymath.matrix",
  "polymath.matrix3",
]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "fpzip"
ignore_missing_imports = true

# The tests are the only annotated code mypy checks, and they exercise the runtime API
# far more loosely than a stub can describe. These codes fire on constructs that are
# correct at runtime and that no change to the tests or the stubs can express, so they
# are switched off here rather than silenced line by line thousands of times:
#   - Qube declares the arithmetic operators once and returns Qube, so a subclass result
#     loses its class: attr-defined, union-attr, assignment, call-arg, operator, misc.
#   - values, vals, and mask return a union of a number and an array, so subscripting a
#     result that is known to be an array is rejected: index, call-overload.
#   - A derivative is attached under a name such as d_dt by setattr, so no declaration
#     can exist for it: attr-defined.
# Everything mypy can still say about the tests stays on, including the annotations that
# every test function is required to carry. Each code above is load-bearing: re-enabling
# the set reports over five thousand errors, none of them a defect.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["assignment", "attr-defined", "call-arg", "call-overload",
                      "index", "misc", "operator", "union-attr"]

[tool.ruff]
target-version = "py311"
# Must match max-line-length in .flake8, which CI currently enforces.
line-length = 90
exclude = [
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
# RUF005 - Collection literal concatenation. Qube overloads `+`, so the rule
#   cannot tell vector addition from list concatenation. Its fix silently
#   rewrites `vector + (EPS, 0, 0)` into `(*vector, EPS, 0, 0)`, which changes
#   the result rather than the style.
# I001 - Import sorting. The fix collapses the column-aligned `import` keywords
#   this codebase uses throughout (the same alignment .flake8 preserves by
#   ignoring E221 and friends). Drop this ignore to let ruff normalize imports.
extend-ignore = ["PT011", "SIM105", "SIM108", "RUF005", "I001"]

[tool.ruff.lint.per-file-ignores]
# E501: test files are exempt from the line length limit so that expected-value
#   tables can stay aligned and readable.
# N806: variable names mirrored from the API under test.
# E712: comparisons against True/False are deliberate in mask assertions.
# E721: `assert type(x) == float` checks the exact type on purpose. Qube
#   subclasses each other, so isinstance() would accept the wrong class and
#   silently weaken these assertions.
# E711: `== None` is deliberate. Qube and Unit overload __eq__, so `is None`
#   asks a different question than the assertion was written to ask.
# SIM113: test_qube_iterate.py keeps a manual counter precisely to check it
#   against the index that enumerate() and ndenumerate() produce.
"tests/*" = ["E501", "N806", "E712", "E721", "E711", "SIM113"]

# The extensions modules define free functions that are bound onto Qube as
# methods, which makes several rules structurally unavoidable there.
# N807: functions named __getitem__, __abs__, and so on, bound as dunders.
# E402: __init__.py interleaves imports with the assignments that bind them.
# A001: methods deliberately named after builtins (Qube.abs, Qube.any, ...),
#   mirroring the NumPy API.
"src/polymath/extensions/*" = ["N807", "E402", "A001"]

# RUF012 wants ClassVar annotations, but annotations are not permitted anywhere
# under src (see .claude/rules/python.md), so the rule cannot be satisfied.
"src/*" = ["RUF012"]

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.pymarkdown.plugins.md025]
# Multiple top-level headings. The README uses a level-one heading per major
# section, and those levels feed the Sphinx TOC through the include in
# docs/index.rst, so they are deliberate.
enabled = false

[tool.pymarkdown.plugins.md041]
# First line must be a top-level heading. The README opens with badges; the
# Sphinx include starts after the <!-- start-after-point --> marker instead.
enabled = false

# Uncomment when enabling bandit in [project.optional-dependencies].dev.
# [tool.bandit]
# exclude_dirs = ["tests", "venv", ".venv"]
# targets = ["src"]

# Uncomment when enabling vulture in [project.optional-dependencies].dev.
# [tool.vulture]
# paths = ["src"]
# exclude = ["tests/"]
# min_confidence = 70
